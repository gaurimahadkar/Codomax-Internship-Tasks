<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Inkspire</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="auth-page">

<a class="logo auth-logo" href="index.html">
    <span>i</span> inkspire.
</a>

<main class="auth-shell">

    <section class="auth-art">

        <span class="eyebrow light">WELCOME BACK</span>

        <h1>
            Your next<br>
            great idea is<br>
            <em>waiting.</em>
        </h1>

        <p>Pick up where your curiosity left off.</p>

        <blockquote>
            “A word after a word after a word is power.”
            <small>— Margaret Atwood</small>
        </blockquote>

    </section>

    <section class="auth-panel">

        <form class="auth-form" id="loginForm">

            <span class="eyebrow">YOUR CREATIVE SPACE</span>

            <h2>Welcome back</h2>

            <p class="muted">
                Log in to continue your journey.
            </p>

            <label>
                Email address
                <input
                    id="loginEmail"
                    type="email"
                    placeholder="you@example.com"
                    required
                >
            </label>

            <label>
                Password
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >
            </label>

            <button class="btn btn-primary full" type="submit">
                Log in ↗
            </button>

            <p id="loginMessage" class="message"></p>

            <p class="switch">
                New to Inkspire?
                <a href="register.html">Create an account</a>
            </p>

            <a class="back" href="index.html">
                ← Back to home
            </a>

        </form>

    </section>

</main>

<script src="js/auth.js"></script>

</body>
</html>
